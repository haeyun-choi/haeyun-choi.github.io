<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <div class="page">
      {% include nav.html %}
      <main>
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
        <a class="visitors-link" href="https://mapmyvisitors.com/web/1c6ho" target="_blank" rel="noopener noreferrer">Welcome</a>
      </footer>
    </div>
    <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=hCMnrBzcMPEch7pI-EwtMghM7XcQT7QQRqMu5LCywvU&cl=ffffffff&w=a"></script>
  </body>
</html>
