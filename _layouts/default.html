<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <div class="page">
      {% include nav.html %}
      <main>
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
        <a class="visitors-link" href="https://mapmyvisitors.com/web/1byvf" target="_blank" rel="noopener noreferrer">Welcome</a>
      </footer>
    </div>
    <a
      class="mapmyvisitors-tracker-link"
      href="https://mapmyvisitors.com/web/1byvf"
      target="_blank"
      rel="noopener noreferrer"
      aria-hidden="true"
      tabindex="-1"
    >
      <img
        class="mapmyvisitors-tracker"
        src="https://mapmyvisitors.com/map.png?d=Txzchan--LHgCtiq4Cdc9Zy_a6jPoV6smG_rkdT6Yoo&cl=ffffffff"
        alt=""
        width="1"
        height="1"
      >
    </a>
  </body>
</html>
